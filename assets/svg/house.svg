<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <!-- SKY BACKGROUND -->
  <rect id="sky" x="0" y="0" width="400" height="280" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- SUN -->
  <circle id="sun" cx="355" cy="55" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- CLOUD -->
  <ellipse id="cloud-left" cx="60" cy="60" rx="30" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <ellipse id="cloud-right" cx="95" cy="55" rx="28" ry="16" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- CHIMNEY (behind roof) -->
  <rect id="chimney-body" x="255" y="95" width="30" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="chimney-top" x="250" y="88" width="40" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- MAIN ROOF -->
  <polygon id="roof-main" points="200,90 80,185 320,185" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- ROOF LEFT SECTION -->
  <polygon id="roof-left" points="200,90 80,185 140,185" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- ROOF RIGHT SECTION -->
  <polygon id="roof-right" points="200,90 260,185 320,185" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- ROOF MIDDLE SECTION -->
  <polygon id="roof-mid" points="200,90 140,185 260,185" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- MAIN WALL (front face) -->
  <rect id="wall-front" x="80" y="185" width="240" height="145" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- LEFT WINDOW FRAME -->
  <rect id="win-left-frame" x="100" y="205" width="70" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- Left window panes (4 panes) -->
  <rect id="win-left-tl" x="100" y="205" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="win-left-tr" x="137" y="205" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="win-left-bl" x="100" y="237" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="win-left-br" x="137" y="237" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- RIGHT WINDOW FRAME -->
  <rect id="win-right-frame" x="230" y="205" width="70" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- Right window panes (4 panes) -->
  <rect id="win-right-tl" x="230" y="205" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="win-right-tr" x="267" y="205" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="win-right-bl" x="230" y="237" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect id="win-right-br" x="267" y="237" width="33" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- DOOR FRAME -->
  <rect id="door-frame" x="175" y="255" width="50" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- DOOR UPPER PANEL -->
  <rect id="door-panel-top" x="181" y="261" width="38" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- DOOR LOWER PANEL -->
  <rect id="door-panel-bot" x="181" y="295" width="38" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- DOOR KNOB -->
  <circle id="door-knob" cx="218" cy="295" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- GROUND STRIP -->
  <rect id="ground" x="0" y="330" width="400" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- GARDEN LEFT -->
  <rect id="garden-left" x="0" y="310" width="80" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- GARDEN RIGHT -->
  <rect id="garden-right" x="320" y="310" width="80" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- PATH / WALKWAY -->
  <rect id="path" x="165" y="330" width="70" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- FENCE LEFT POST 1 -->
  <rect id="fence-l1" x="10" y="305" width="12" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- FENCE LEFT RAIL -->
  <rect id="fence-l-rail" x="10" y="315" width="70" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- FENCE LEFT POST 2 -->
  <rect id="fence-l2" x="40" y="305" width="12" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- FENCE LEFT POST 3 -->
  <rect id="fence-l3" x="68" y="305" width="12" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- FENCE RIGHT POST 1 -->
  <rect id="fence-r1" x="320" y="305" width="12" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- FENCE RIGHT RAIL -->
  <rect id="fence-r-rail" x="320" y="315" width="70" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- FENCE RIGHT POST 2 -->
  <rect id="fence-r2" x="348" y="305" width="12" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- FENCE RIGHT POST 3 -->
  <rect id="fence-r3" x="376" y="305" width="12" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

</svg>
