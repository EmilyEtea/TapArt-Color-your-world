name: tapart
description: TapArt — a kid-friendly digital coloring web app by Emily Etea.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  intl: ^0.18.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/logo.png
    - assets/bg.png
